services:
  postgres:
    image: postgres:16-alpine
    container_name: instos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instos
    ports:
      - "5432:5432"
    volumes:
      - instos_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instos"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instos-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/instos?schema=public
      PORT: 4000
      JWT_SECRET: instos_production_jwt_secret_dev_31180345
      NODE_ENV: production
    ports:
      - "4000:4000"

volumes:
  instos_pgdata:
