services:
  postgres:
    image: postgres:16-alpine
    container_name: instos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instos
    ports:
      - "5432:5432"
    volumes:
      - instos_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  instos_pgdata:
